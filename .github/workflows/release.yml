name: CI & Publish Extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test

  release:
    name: Package VSIX & Publish
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate Icon & Package VSIX
        run: |
          npm run generate-icon
          npx --yes @vscode/vsce package --no-dependencies -o claude-quota-statusbar.vsix
      - name: Upload VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: claude-quota-statusbar.vsix
          generate_release_notes: true
      - name: Publish to VS Code Marketplace (OIDC Trusted Publishing / VSCE_PAT)
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx --yes @vscode/vsce publish --packagePath claude-quota-statusbar.vsix --skip-duplicate -p "$VSCE_PAT"
          else
            npx --yes @vscode/vsce publish --packagePath claude-quota-statusbar.vsix --oidc --skip-duplicate
          fi
      - name: Publish to Open VSX Registry (if OVSX_PAT configured)
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish claude-quota-statusbar.vsix --skip-duplicate -p "$OVSX_PAT"

